    角色名: 熊初墨
    角色简介: 主角的丈夫，一名在国企上班的员工。表面斯文顾家，实则是深柜男同性恋者，为了家庭压力与传宗接代而娶妻生子。出轨对象为一名男性，对妻子和家庭极其冷漠与鄙夷。
  - 年龄: '32'
    性别: 女
    性格特征: 隐忍、细腻、果断、有仇必报
    角色名: 李想
    角色简介: 主角，熊初墨的妻子，四岁儿子李想的母亲。在发现丈夫出轨且对自己极度鄙夷后，从最初的隐忍转变为冷静的复仇者，精心策划了一场让丈夫身败名裂的报复行动。
  - 年龄: 未知
