剧本:
  元数据:
    原作: 黏住了
    原作者: ''
    改编章节数: 4
    标题: 黏住了
    转换日期: '2026-06-06'
  幕:
  - 场:
    - 人物:
      - 熊初墨
      内容:
      - 内容: 熊初墨靠在沙发上看手机，屏幕上是外卖App的界面，显示“预计送达还剩20分钟”。他的手指漫不经心地滑动着，眉头微皱，似乎对等待感到不耐烦。
        类型: 动作描写
      - 台词: 外卖还有二十分钟才到。不急。
        类型: 对白
        表情: 语气平淡，带着一丝敷衍的从容。
        角色: 熊初墨
      场号: 1
      场景: 熊初墨母亲家的客厅
      时间: 傍晚，晚餐前
    - 人物:
      - 熊初墨
      - 熊初墨母亲
      内容:
      - 内容: 手机震动，熊初墨接起电话，简短应了几句“好，放门卫那儿”。挂断后，他站起身，走向门口换鞋。
        类型: 动作描写
      - 台词: (从厨房探出头) 外卖到了？你去拿？
        类型: 对白
        表情: 怀疑地眯起眼睛，语气带着试探。
        角色: 熊初墨母亲
      - 台词: 嗯，我去拿就行。您别出来。
        类型: 对白
        表情: 头也不回，语气故作随意。
        角色: 熊初墨
      - 内容: 熊初墨拉开门，闪身出去。门在身后轻轻关上，发出“咔哒”一声。
        类型: 动作描写
      场号: 2
      场景: 熊初墨母亲家的餐厅
      时间: 此时，接到外卖电话后
    - 人物:
      - 熊初墨
      内容:
      - 内容: 夜幕已降，路灯昏黄。熊初墨快步走到小区门口的快递柜旁，从格子取出一个精致的小纸袋，里面是一个深蓝色丝绒盒子。他打开盒盖，里面静静躺着一条铂金项链，链坠是一颗圆润的珍珠。他借着微弱的灯光端详了两秒，嘴角勾起一丝得意的笑意，随即合上盒子，小心地揣进外套内侧口袋。
        类型: 动作描写
      - 内容: 路灯在他身后投下长长的影子，他转身往回走，脚步轻快。
        类型: 舞台指示
      场号: 3
      场景: 熊初墨母亲家楼下/小区门口
      时间: 紧接着
    - 人物:
      - 熊初墨
      - 熊初墨母亲
      内容:
      - 内容: 熊初墨推门而入，脸上挂着轻松的笑。熊初墨母亲正坐在餐桌旁，面前摆着两副碗筷。
        类型: 动作描写
      - 台词: 怎么去了这么久？
        类型: 对白
        表情: 审视着儿子，目光如针。
        角色: 熊初墨母亲
      - 台词: (拍了拍口袋) 顺便取了个快递，给朋友带的。
        类型: 对白
        表情: 眼神飘忽，避开与母亲对视。
        角色: 熊初墨
      - 台词: (冷哼一声) 朋友？男的还是女的啊？
        类型: 对白
        表情: 带着明显的不满和猜忌。
        角色: 熊初墨母亲
      - 台词: 当然是男的，公司同事。妈，您别想太多。
        类型: 对白
        表情: 语气生硬，带着一丝被冒犯的烦躁。
        角色: 熊初墨
      - 内容: 灯光下，母子间的空气凝固了片刻。熊初墨母亲不再追问，低头开始摆弄碗里的菜，但眼神依旧犀利。
        类型: 舞台指示
      场号: 4
      场景: 熊初墨母亲家的客厅
      时间: 回到屋内后
    幕号: 4
    幕标题: 序曲之乱
