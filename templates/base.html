<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}转笔为剧{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>

    <!-- 导航栏 — 毛玻璃效果 -->
    <header class="nav">
        <div class="container">
            <a href="{{ url_for('index') }}" class="nav-brand"><i class="pen">✍️</i> 转笔为剧</a>
            <div class="nav-loading" id="navLoading"></div>
        </div>
    </header>

    <!-- 加载遮罩（转换中显示） -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">AI 正在分析小说，生成剧本中...</div>
    </div>

    <!-- 主内容区 -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>AI Novel to Script Tool <span>·</span> 比赛作品 <span>·</span> v1.0</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
<script>
// 点击墨点效果
document.addEventListener("click", (e) => {
    const ink = document.createElement("div");
    ink.className = "ink-splash";
    ink.style.left = (e.clientX - 8) + "px";
    ink.style.top = (e.clientY - 8) + "px";
    ink.style.width = ink.style.height = "16px";
    document.body.appendChild(ink);
    requestAnimationFrame(() => ink.classList.add("ink-burst"));
    setTimeout(() => ink.remove(), 600);
});
</script>
</body>
</html>
