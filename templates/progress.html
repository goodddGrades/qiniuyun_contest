{% extends "base.html" %}
{% block title %}转换中 - 转笔为剧{% endblock %}

{% block head %}
<style>
.whale-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}
.whale {
    position: absolute;
    font-size: 28px;
    opacity: 0.4;
    animation: swim linear infinite;
}
.whale:nth-child(1) { top: 10%; font-size: 24px; animation-duration: 14s; animation-delay: 0s; }
.whale:nth-child(2) { top: 25%; font-size: 32px; animation-duration: 18s; animation-delay: 1s; }
.whale:nth-child(3) { top: 45%; font-size: 26px; animation-duration: 12s; animation-delay: 3s; }
.whale:nth-child(4) { top: 60%; font-size: 30px; animation-duration: 16s; animation-delay: 5s; }
.whale:nth-child(5) { top: 78%; font-size: 22px; animation-duration: 15s; animation-delay: 2s; }
.whale:nth-child(6) { top: 35%; font-size: 20px; animation-duration: 20s; animation-delay: 7s; }
.whale:nth-child(7) { top: 70%; font-size: 28px; animation-duration: 13s; animation-delay: 4s; }

@keyframes swim {
    0%   { left: -60px; transform: scaleX(1); }
    49%  { transform: scaleX(1); }
    50%  { left: calc(100% + 20px); transform: scaleX(-1); }
    99%  { transform: scaleX(-1); }
    100% { left: -60px; transform: scaleX(1); }
}
</style>
{% endblock %}

{% block content %}
<div class="whale-container">
    <span class="whale">🐳</span>
    <span class="whale">🐳</span>
    <span class="whale">🐳</span>
    <span class="whale">🐳</span>
    <span class="whale">🐳</span>
    <span class="whale">🐳</span>
    <span class="whale">🐳</span>
</div>
<div class="card progress-card">
    <div class="progress-header">
        <h1><img src="{{ url_for('static', filename='penrunning.gif') }}" alt="转笔" class="pen-gif"> 小编正在给你改稿</h1>
        <p class="subtitle" id="statusText">正在准备...</p>
    </div>

    <div class="progress-bar-container">
        <div class="progress-track">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div class="progress-steps" id="progressSteps">
            <span class="step" data-step="1">📖 分析角色</span>
            <span class="step" data-step="2">✍️ 转换章节</span>
            <span class="step" data-step="3">📝 生成剧本</span>
            <span class="step" data-step="4">✅ 完成</span>
        </div>
    </div>

    <div class="progress-detail" id="progressDetail">
        <p>请耐心等待，好多小鲸鱼在一起帮你转换...</p>
    </div>

    <div class="progress-actions">
        <button class="btn btn-danger" id="cancelBtn" onclick="cancelConversion()">取消转换</button>
    </div>

    <div class="progress-spinner" id="progressSpinner">
        <div class="loading-dots">
            <span></span><span></span><span></span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const TASK_ID = "{{ task_id }}";
let polling = true;

const PHASES = {
    "queued":     { step: 0, pct: 0,  text: "正在准备..." },
    "analyzing":  { step: 1, pct: 15, text: "正在分析小说角色..." },
    "converting": { step: 2, pct: 45, text: "小鲸鱼们正在并行转换章节..." },
    "saving":     { step: 3, pct: 85, text: "正在生成剧本..." },
    "done":       { step: 4, pct: 100, text: "转换完成！" },
    "error":      { step: 0, pct: 0,  text: "转换失败" },
};

function updateProgress(data) {
    const phase = PHASES[data.status] || PHASES["queued"];
    const pct = Math.max(
        data.total > 0 ? Math.round((data.current / data.total) * 70) + 15 : 0,
        phase.pct
    );

    // 进度条
    document.getElementById("progressFill").style.width = Math.min(pct, 100) + "%";

    // 状态文字
    document.getElementById("statusText").textContent = data.message || phase.text;

    // 步骤高亮
    document.querySelectorAll(".step").forEach((el, i) => {
        const step = i + 1;
        el.classList.toggle("active", step <= phase.step);
        el.classList.toggle("done", step < phase.step || data.status === "done");
    });

    return data.status;
}

async function poll() {
    if (!polling) return;
    try {
        const resp = await fetch(`/progress/${TASK_ID}/status`);
        const data = await resp.json();
        const status = updateProgress(data);

        if (status === "done") {
            setTimeout(() => {
                window.location.href = "/result/" + data.result_id;
            }, 800);
            return;
        }
        if (status === "error") {
            document.getElementById("cancelBtn").style.display = "none";
            document.getElementById("progressSpinner").innerHTML =
                `<p class="error-msg">❌ ${data.message}</p>
                 <a href="/" class="btn btn-outline">返回首页</a>`;
            return;
        }
        if (status === "cancelled") {
            document.getElementById("cancelBtn").style.display = "none";
            document.getElementById("progressSpinner").innerHTML =
                `<p class="success-msg">⏹️ 已取消转换</p>
                 <a href="/" class="btn btn-outline">返回首页</a>`;
            return;
        }
        if (status === "cancelling") {
            document.getElementById("cancelBtn").disabled = true;
            document.getElementById("cancelBtn").textContent = "正在取消...";
        }
        setTimeout(poll, 1500);
    } catch (e) {
        setTimeout(poll, 2000);
    }
}

function cancelConversion() {
    polling = false;  // 立即停止轮询
    document.getElementById("cancelBtn").style.display = "none";
    document.getElementById("statusText").textContent = "正在取消...";
    fetch(`/progress/${TASK_ID}/cancel`, { method: "POST" }).catch(() => {});
    setTimeout(() => { window.location.href = "/"; }, 300);
}

poll();
</script>
{% endblock %}
