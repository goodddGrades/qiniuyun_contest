{% extends "base.html" %}
{% block title %}上传小说 - AI 小说转剧本工具{% endblock %}

{% block content %}
<div class="card upload-card">
    <h1>AI 小说转剧本工具</h1>
    <p class="subtitle">将你的小说章节自动转换为结构化剧本（YAML 格式）</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('convert') }}" method="POST" class="upload-form">
        <div class="form-group">
            <label for="title">作品名称</label>
            <input type="text" id="title" name="title"
                   placeholder="（可选）输入小说名称" class="form-input">
        </div>

        <div class="form-group">
            <label for="novel_text">粘贴小说内容
                <span class="hint">至少 3 个章节，用「第X章」分隔</span>
            </label>
            <textarea id="novel_text" name="novel_text" rows="20"
                      placeholder="在此粘贴你的小说内容，包含章节标题..."

                      class="form-textarea"></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-lg">
            ✨ 开始转换
        </button>
    </form>

    <div class="tips">
        <h3>使用提示</h3>
        <ul>
            <li>粘贴至少 3 章以上的小说内容</li>
            <li>建议用「第X章」或「Chapter X」作为章节分隔</li>
            <li>转换后可在编辑页面进一步打磨剧本</li>
            <li>最终可导出为 YAML 文件</li>
        </ul>
    </div>
</div>
{% endblock %}
